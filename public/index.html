<!DOCTYPE html>
<html lang="en">

  <style>

      --border-strong: #a9bea1;

      --muted-2: #7c8d78;

      --green-2: #3f7a45;

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      color: var(--text);
      font-family: Georgia, serif;

        radial-gradient(circle at top left, rgba(255,255,255,.95), rgba(255,255,255,0) 34%),
        linear-gradient(180deg, var(--page-bg-2) 0%, var(--page-bg) 52%, #dfead8 100%);
    }
    button, input, select, textarea { font-family: Georgia, serif; }
    .wrap { min-height: 100vh; padding-bottom: 80px; }
    .header {
      background: linear-gradient(135deg,#f8faf3,#e2ecd9);
      border-bottom: 1px solid var(--border);
      padding: 24px 18px 18px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 5;
      box-shadow: 0 2px 16px rgba(47,93,53,.08);
    }
    .title { margin: 0; font-size: 22px; font-weight: normal; letter-spacing: .05em; color: var(--green); }
    .sub { margin: 4px 0 0; font-size: 12px; color: var(--muted); letter-spacing: .08em; }
    .status { margin-top: 7px; font-size: 11px; color: var(--green-2); font-weight: bold; }
    .adminBtn { position:absolute; top:18px; right:14px; border-radius:6px; padding:5px 9px; font-size:11px; cursor:pointer; }
    .section { padding: 12px 16px; border-bottom: 1px solid var(--border); background: rgba(255,253,247,.58); }
    .label { font-size: 11px; color: var(--muted); letter-spacing:.1em; margin-bottom:8px; }
    .select, .input {
      width: 100%;

    .tab { flex:1; padding:14px 8px; background:transparent; border:0; color: var(--muted); cursor:pointer; }
    .tab.active { background: var(--green-soft); color: var(--green); border-bottom:2px solid var(--green); font-weight:bold; }

    .row { display:flex; gap:8px; align-items:center; }
    .player {
      flex:1;
      padding:14px 16px;
      border-radius:10px;

    .player.maybe { background: linear-gradient(135deg,#fff4d8,#f7e6b8); border-color:#d7b35f; color:#7a5a16; font-weight:bold; }

    .confirmedBox { margin:14px 16px 0; padding:12px 14px; border:1px solid var(--border-strong); background: var(--panel-soft); border-radius:12px; box-shadow: var(--shadow); }
    .confirmedTitle { font-size:12px; color:var(--green); letter-spacing:.08em; margin-bottom:8px; font-weight:bold; }
    .confirmedChips { display:flex; flex-wrap:wrap; gap:7px; }
    .chip { padding:6px 9px; border-radius:999px; background:#ffffff; border:1px solid var(--border-strong); color:var(--green); font-size:13px; }
    .chip.maybeChip { border-color:#d7b35f; color:#7a5a16; background:#fff4d8; }

    .adminPanel { margin: 14px 16px 0; padding: 12px; border:1px solid var(--border); background: rgba(255,253,247,.84); border-radius:12px; display:flex; flex-direction:column; gap:10px; box-shadow: var(--shadow); }
    .adminTitle { font-size:12px; color:var(--muted); letter-spacing:.08em; }
    .btn { width:100%; padding:12px 13px; border-radius:9px; border:1px solid var(--border-strong); background: var(--panel); color: var(--green); text-align:left; cursor:pointer; }
    .msg { margin: 12px 16px 0; padding: 10px 12px; border-radius:9px; font-size:13px; border:1px solid var(--border-strong); background: var(--panel-soft); color:var(--green); box-shadow: var(--shadow); }
    .msg.err { border-color:#d19a92; color:var(--danger); background:var(--danger-soft); }
    .draw { margin: 14px 16px 0; border:1px solid var(--border-strong); background: var(--panel-soft); border-radius:12px; overflow:hidden; box-shadow: var(--shadow); }
    .drawHead { padding:12px 14px; color:var(--green); border-bottom:1px solid var(--border); font-weight:bold; font-size:13px; }
    .group { margin:10px 12px; border:1px solid var(--border); border-radius:9px; overflow:hidden; background:#fffdf7; }
    .groupH { padding:8px 12px; background:#eaf2e4; color:var(--green); font-size:12px; display:flex; justify-content:space-between; }
    .groupP { padding:9px 12px; border-top:1px solid var(--border); color:var(--text); }
    .modal { position:fixed; inset:0; z-index:20; background:rgba(30,44,30,.38); backdrop-filter: blur(3px); display:flex; align-items:center; justify-content:center; padding:20px; }
    .modalBox { width:100%; max-width:330px; background:var(--panel); border:1px solid var(--border-strong); border-radius:16px; padding:24px; text-align:center; box-shadow: 0 16px 48px rgba(46,68,44,.22); }
    .modalActions { display:flex; gap:10px; margin-top:16px; }
    .ghost { flex:1; padding:12px; background:#ffffff; border:1px solid var(--border); border-radius:8px; color:var(--muted); cursor:pointer; }
    .green { flex:1; padding:12px; background:var(--green); border:0; border-radius:8px; color:#ffffff; font-weight:bold; cursor:pointer; }

    .identityBox { margin: 12px 16px 0; padding: 12px; border:1px solid var(--border); background: rgba(255,253,247,.78); border-radius:12px; box-shadow: var(--shadow); }
    .identityRow { display:flex; gap:8px; align-items:center; margin-top:8px; }
    .identityRow .select, .identityRow .input { box-shadow:none; }
    .lockedOther { opacity:.45; }
    .priorityBtn { min-width:72px; padding:12px 8px; border-radius:10px; border:1px solid #d7b35f; background:#fff8df; color:#8a661c; cursor:pointer; font-size:12px; }
    .priorityBtn.active { background:#f1d78a; border-color:#b98f2f; font-weight:bold; }
    .auditLog { max-height:220px; overflow:auto; border:1px solid var(--border); border-radius:9px; background:#fffdf7; }
    .auditItem { padding:8px 10px; border-bottom:1px solid var(--border); font-size:12px; color:var(--muted); }
    .auditItem:last-child { border-bottom:0; }
</style>
</head>

<script type="text/babel">
const { useEffect, useMemo, useState } = React;
const ADMIN_PIN = "2727";
const VERSION = "v14";
const APP_URL = "https://bazandnobbyschool.pages.dev";

const INITIAL_MEMBERS = ["Baby Dave", "Bob", "Colin", "Dean", "Doc", "Ethan", "Jason", "Kevin", "Lewis", "Major", "Mark Mark", "Matt", "Meeky", "Muller", "Nathan", "Pedders", "Ryan", "Sam", "Simon H", "Wayne"];

const FIXTURE_COMPS = {
  "2026-01-03":"Medal","2026-01-04":"Winter League","2026-01-10":"4 Ball","2026-01-11":"Bogey","2026-01-17":"Yellow Ball Competition","2026-01-18":"Winter League","2026-01-24":"Stableford","2026-01-25":"4 Ball","2026-01-31":"Stableford Team Event (4 person waltz)","2026-02-01":"Winter League","2026-02-07":"Stableford","2026-02-08":"Bogey","2026-02-14":"Medal","2026-02-15":"Winter League","2026-02-21":"Mixed Yellow Ball Stableford","2026-02-22":"4 Ball","2026-02-28":"Bogey","2026-03-01":"Stableford","2026-03-07":"Medal","2026-03-08":"Texas Scramble","2026-03-14":"Stableford","2026-03-15":"4 Ball (Mother's Day)","2026-03-21":"2-Man Aggregate Stableford","2026-03-22":"Medal","2026-03-28":"Stableford","2026-03-29":"Captains' Drive-Ins & 4BBB","2026-04-04":"4-Ball Stableford","2026-04-05":"Medal (Easter Sunday)","2026-04-11":"Chairman's Trophy (Greensome)","2026-04-12":"Druids Cup / Medal","2026-04-18":"Stableford","2026-04-19":"Champion of Champions Medal","2026-04-25":"V H Pearce 2-Man Texas Scramble","2026-04-26":"Dusty Bin Stableford","2026-05-02":"Stan Creswell Trophy Medal","2026-05-03":"Foursomes Cup","2026-05-09":"1st Invitation Day","2026-05-10":"Over 50's Cup Medal","2026-05-16":"Mixed 4BBB Stableford","2026-05-17":"Stableford (4 person team)","2026-05-23":"Stableford","2026-05-24":"Boldmere Bowl Medal","2026-05-30":"4 Ball","2026-05-31":"Captain's Charity Shield Stableford","2026-06-06":"Presidents Championship Day Medal","2026-06-07":"Stableford","2026-06-13":"4 Ball","2026-06-14":"Members Memorial Salver Medal","2026-06-20":"Captain's Open AM AM","2026-06-21":"Stableford (Father's Day)","2026-06-27":"Pro's Day Medal","2026-06-28":"4 Ball","2026-07-04":"Greensome / Yardley Holland Cup","2026-07-05":"Secretary's Cup Medal","2026-07-11":"Club Championship Round 1","2026-07-12":"Club Championship Round 2","2026-07-18":"Captain's Weekend Texas Scramble","2026-07-19":"Captain's Weekend Men's 4 Ball","2026-07-25":"Scratch Stableford","2026-07-26":"M & S Pooley Cup 4 Ball","2026-08-01":"Greensome / Yardley Holland Cup","2026-08-02":"Twyford Seeds Cup Medal","2026-08-08":"Stableford Yellow Ball","2026-08-09":"Bill Mountford Memorial Trophy Stableford","2026-08-15":"Gents Open","2026-08-16":"Bogey","2026-08-22":"Stableford","2026-08-23":"Ray Garnett Trophy Texas Scramble","2026-08-29":"President's Day","2026-08-30":"Golfer Non-Golfer","2026-09-05":"Batevale Trophy Medal","2026-09-06":"Stableford","2026-09-12":"P.G. Whatton Trophy Stableford","2026-09-13":"2nd Invitation Day","2026-09-19":"L.E. Swain Trophy Medal","2026-09-20":"4 Ball","2026-09-26":"Stableford (Junior Fundraiser)","2026-09-27":"Paul Canning Trophy Medal","2026-10-03":"Green's Committee Cup Medal","2026-10-04":"Stableford","2026-10-10":"4 Ball","2026-10-11":"Greenkeeper's Tankard","2026-10-17":"Bogey","2026-10-18":"Stableford","2026-10-24":"Stableford Texas AM-AM","2026-10-25":"Winter League","2026-10-31":"Bogey","2026-11-01":"Winter League","2026-11-07":"Stableford","2026-11-08":"4 Ball","2026-11-14":"Medal","2026-11-15":"Winter League","2026-11-21":"Stableford","2026-11-22":"2 Man Aggregate Stableford","2026-11-28":"4 Ball","2026-11-29":"Stableford","2026-12-06":"Winter League","2026-12-12":"Texas AM AM","2026-12-13":"Winter League","2026-12-19":"Pro's Christmas Jumper","2026-12-20":"Christmas Stableford"
};

const initDay = (comp="") => ({ players: [], maybes: [], priorityPlayers: [], locked: false, competition: comp, audit: [], draw: null });
const toDateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromDateKey = key => { const [y,m,d] = key.split("-").map(Number); return new Date(y, m-1, d); };
const formatDate = d => d.toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long" });
const groupLabel = n => n === 4 ? "4-ball" : n === 3 ? "3-ball" : n === 2 ? "2-ball" : `${n}-ball`;

function getUpcomingWeekends(count=52) {
  const out=[]; const today=new Date(); today.setHours(0,0,0,0);
  const daysUntilSat=(6-today.getDay()+7)%7 || 7;
  const firstSat=new Date(today); firstSat.setDate(today.getDate()+daysUntilSat);
  for(let i=0;i<count;i++){ const sat=new Date(firstSat); sat.setDate(firstSat.getDate()+i*7); const sun=new Date(sat); sun.setDate(sat.getDate()+1); const daysUntil=Math.round((sat-today)/86400000); out.push({ sat, sun, past:false, tooSoon:daysUntil<10 }); }
  return out;
}
function getPastWeekends(count=8) {
  const out=[]; const today=new Date(); today.setHours(0,0,0,0);
  const daysUntilSat=(6-today.getDay()+7)%7 || 7; const firstSat=new Date(today); firstSat.setDate(today.getDate()+daysUntilSat);
  for(let i=1;i<=count;i++){ const sat=new Date(firstSat); sat.setDate(firstSat.getDate()-i*7); const sun=new Date(sat); sun.setDate(sat.getDate()+1); out.unshift({sat,sun,past:true}); }
  return out;
}
function isAutoLocked(date) {
  const now=new Date(); const dow=now.getDay(); const mins=now.getHours()*60+now.getMinutes(); const cutoff=18*60+50; const dateDow=date.getDay(); const daysAway=Math.round((date-now)/86400000);
  if(dateDow===6 && dow===3 && mins>=cutoff && daysAway>=2 && daysAway<=4) return true;
  if(dateDow===0 && dow===4 && mins>=cutoff && daysAway>=2 && daysAway<=4) return true;
  return false;
}
function getSignupCutoff(date) {
  // Tee times are booked 10 days before the playing date at 6:50pm UK time.
  // Saturday therefore closes on the Wednesday 10 days before; Sunday closes on the Thursday 10 days before.
  const cutoff = new Date(date);
  cutoff.setDate(cutoff.getDate() - 10);
  cutoff.setHours(18, 50, 0, 0);
  return cutoff;
}
function isSignupClosed(date) {
  return Date.now() >= getSignupCutoff(date).getTime();
}
function formatCutoff(date) {
  return getSignupCutoff(date).toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"short" }) + " at 6:50pm";
}
function buildBase() { const base={}; Object.entries(FIXTURE_COMPS).forEach(([key, comp]) => base[key]=initDay(comp)); return base; }
function mergeWithBase(saved) {
  const base=buildBase();
  const merged={...base};
  Object.entries(saved||{}).forEach(([key,val])=>{
    const fixtureComp = base[key]?.competition || "";
    const savedVal = val || {};
    // Important: old/empty saved records must not wipe out fixture names.
    const savedComp = typeof savedVal.competition === "string" ? savedVal.competition.trim() : "";
    merged[key] = {
      ...initDay(fixtureComp),
      ...(base[key]||{}),
      ...savedVal,
      competition: savedComp || fixtureComp
    };
  });
  return merged;
}
function weekendShort(w) { return `${w.sat.getDate()} – ${w.sun.getDate()} ${w.sun.toLocaleDateString("en-GB",{month:"short"})}`; }

async function api(path, payload) {
  const options = payload === undefined ? {} : { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) };
  const res = await fetch(`/api/${path}`, options);
  const data = await res.json().catch(()=>({ok:false,error:"Bad JSON response"}));
  if (!data.ok) throw new Error(data.error || "Request failed");
  return data;
}

function App(){
  const [schedule,setSchedule]=useState(mergeWithBase({}));
  const [status,setStatus]=useState("Loading...");
  const [message,setMessage]=useState("");
  const [error,setError]=useState("");
  const [adminMode,setAdminMode]=useState(localStorage.getItem("wg_admin") === "1");
  const [pin,setPin]=useState("");
  const [showPin,setShowPin]=useState(false);
  const [selectedKey,setSelectedKey]=useState(localStorage.getItem("wg_date") || "");
  const [activeDay,setActiveDay]=useState(localStorage.getItem("wg_day") || "sat");
  const [confirmRemove,setConfirmRemove]=useState(null);
  const [confirmAdd,setConfirmAdd]=useState(null);
  const [confirmMaybe,setConfirmMaybe]=useState(null);
  const [newName,setNewName]=useState("");
  const [editingComp,setEditingComp]=useState(false);
  const [compInput,setCompInput]=useState("");
  const [copiedReminder,setCopiedReminder]=useState(false);
  const [copiedSummary,setCopiedSummary]=useState(false);
  const [playerName,setPlayerName]=useState(localStorage.getItem("wg_player_name") || "");
  const [playerPin,setPlayerPin]=useState(localStorage.getItem("wg_player_pin") || "");
  const [pinLoggedIn,setPinLoggedIn]=useState(localStorage.getItem("wg_player_ok") === "1");
  const [pinPlayer,setPinPlayer]=useState("");
  const [pinValue,setPinValue]=useState("");
  const [pinConfigured,setPinConfigured]=useState({});
  const [showAudit,setShowAudit]=useState(false);

  const upcoming=useMemo(()=>getUpcomingWeekends(52),[]);
  const past=useMemo(()=>getPastWeekends(8),[]);
  const weekends=adminMode ? [...past,...upcoming] : upcoming.slice(0,8);
  const defaultW=weekends[0];
  const chosenW=useMemo(()=>{
    if(selectedKey){ const found=weekends.find(w=>toDateKey(w.sat)===selectedKey || toDateKey(w.sun)===selectedKey); if(found) return found; }
    return defaultW;
  },[selectedKey, weekends]);
  const currentDate=activeDay === "sun" ? chosenW.sun : chosenW.sat;
  const dateKey=toDateKey(currentDate);
  const current=schedule[dateKey] || initDay(FIXTURE_COMPS[dateKey] || "");
  const signupClosed = isSignupClosed(currentDate);
  const effectiveLocked=current.locked || isAutoLocked(currentDate) || (!adminMode && signupClosed);
  const currentPlayers = Array.isArray(current.players) ? current.players : [];
  const currentMaybes = Array.isArray(current.maybes) ? current.maybes.filter(name => !currentPlayers.includes(name)) : [];
  const currentPriority = Array.isArray(current.priorityPlayers) ? current.priorityPlayers.filter(name => currentPlayers.includes(name)) : [];
  const allNames=[...new Set([...INITIAL_MEMBERS, ...currentPlayers, ...currentMaybes])].sort();
  const playerDisplayNames = [
    ...currentPlayers,
    ...currentMaybes.filter(name => !currentPlayers.includes(name)),
    ...allNames.filter(name => !currentPlayers.includes(name) && !currentMaybes.includes(name))
  ];
  const confirmedSummaryText = currentPlayers.length
    ? `${currentPlayers.length} confirmed: ${currentPlayers.join(", ")}`
    : "No players confirmed yet.";

  async function load(){
    try { setStatus("Syncing..."); const data=await api("schedule"); setSchedule(mergeWithBase(data.schedule)); setStatus(`LIVE- ${VERSION}`); setError(""); }
    catch(e){ setStatus(`OFFLINE- ${VERSION}`); setError(e.message); }
  }
  async function loadPinConfig(){
    if(!adminMode) return;
    try { const res = await fetch(`/api/admin/pins?adminPin=${ADMIN_PIN}`); const data = await res.json(); if(data.ok) setPinConfigured(data.configured || {}); }
    catch(e){}
  }
  useEffect(()=>{ load(); }, []);
  useEffect(()=>{ localStorage.setItem("wg_date", dateKey); localStorage.setItem("wg_day", activeDay); }, [dateKey, activeDay]);
  useEffect(()=>{ localStorage.setItem("wg_admin", adminMode ? "1" : "0"); loadPinConfig(); }, [adminMode]);
  useEffect(()=>{ localStorage.setItem("wg_player_name", playerName); localStorage.setItem("wg_player_pin", playerPin); localStorage.setItem("wg_player_ok", pinLoggedIn ? "1" : "0"); }, [playerName, playerPin, pinLoggedIn]);
  // Prevent a competition edit draft from being carried onto another day/weekend.
  useEffect(()=>{ setEditingComp(false); setCompInput(""); }, [dateKey]);

  function optimistic(dateKey, day){ setSchedule(prev=>mergeWithBase({...prev, [dateKey]:day})); }
  function canEditPlayer(name){ return adminMode || (pinLoggedIn && playerName === name); }
  function requireOwnPlayer(name){
    if(adminMode) return true;
    if(!pinLoggedIn || !playerName){ setError("Choose your name and enter your player PIN first."); return false; }
    if(playerName !== name){ setError(`You are logged in as ${playerName}. You can only change your own booking.`); return false; }
    return true;
  }
  async function loginPlayer(){
    try { setError(""); setMessage("Checking player PIN..."); const r=await api("player-login", {name:playerName, pin:playerPin}); setPinLoggedIn(true); setMessage(`✅ Logged in as ${r.name}`); }
    catch(e){ setPinLoggedIn(false); setError(e.message); setMessage(""); }
  }
  function logoutPlayer(){ setPinLoggedIn(false); setPlayerPin(""); localStorage.removeItem("wg_player_pin"); localStorage.setItem("wg_player_ok", "0"); setMessage("Logged out"); }
  async function choosePlaying(name){
    if(effectiveLocked && !adminMode) return;
    if(!requireOwnPlayer(name)) return;
    if(currentPlayers.includes(name)){ setConfirmRemove({ name, from: "playing" }); return; }
    setConfirmAdd({ name, mode: currentMaybes.includes(name) ? "maybeToPlaying" : "toggle" });
  }
  async function chooseMaybe(name){
    if(effectiveLocked && !adminMode) return;
    if(!requireOwnPlayer(name)) return;
    if(currentMaybes.includes(name)){ setConfirmRemove({ name, from: "maybe" }); return; }
    setConfirmMaybe({ name, mode: currentPlayers.includes(name) ? "playingToMaybe" : "maybe" });
  }
  async function setPlayerStatus(name, playerStatus){
    try {
      const label = playerStatus === "playing" ? "playing" : playerStatus === "maybe" ? "maybe" : "not playing";
      setMessage(`Saving ${dateKey}: ${name} as ${label}...`); setError("");
      const r=await api("player-status", {dateKey, name, status: playerStatus, adminPin: adminMode ? ADMIN_PIN : "", playerName, playerPin, competition: current.competition || FIXTURE_COMPS[dateKey] || ""});
      optimistic(r.dateKey, r.data); setMessage(`✅ ${r.message}`);
    }
    catch(e){ setError(e.message); setMessage(""); }
  }
  async function adminPost(path, payload){
    try {
      setMessage("Saving..."); setError("");
      const r=await api(path, {...payload, dateKey, adminPin: ADMIN_PIN, competition: current.competition || FIXTURE_COMPS[dateKey] || ""});
      if(r.dateKey && r.data) optimistic(r.dateKey, r.data); setMessage("✅ Saved"); return r;
    }
    catch(e){ setError(e.message); setMessage(""); }
  }
  async function savePlayerPin(){
    try { setMessage("Saving player PIN..."); setError(""); const r=await api("admin/player-pin", {adminPin:ADMIN_PIN, name:pinPlayer, pin:pinValue}); setPinConfigured(r.configured||{}); setPinValue(""); setMessage(`✅ ${pinValue ? "Saved" : "Cleared"} PIN for ${pinPlayer}`); }
    catch(e){ setError(e.message); setMessage(""); }
  }
  async function togglePriority(name){
    const priority = !currentPriority.includes(name);
    await adminPost("admin/priority", {name, priority});
  }

  const attemptAdmin=()=>{ if(pin===ADMIN_PIN){setAdminMode(true);setShowPin(false);setPin(""); setTimeout(loadPinConfig, 50);} else setError("Incorrect PIN"); };
  const logoutAdmin=()=>setAdminMode(false);
  const changeWeekend=e=>{ setSelectedKey(e.target.value); };
  const weekendIndexLabel=(w,i)=>{
    if(w.past) return "History";
    const futureIndex = upcoming.findIndex(u => toDateKey(u.sat) === toDateKey(w.sat));
    if(futureIndex === 0) return "This weekend";
    if(futureIndex === 1) return "Next weekend";
    return `In ${futureIndex} weekends`;
  };
  const optionLabel=(w,i)=> `${weekendIndexLabel(w,i)} — ${weekendShort(w)}`;


  const copyText = async (text, setter) => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const el = document.createElement("textarea");
        el.value = text;
        el.style.cssText = "position:fixed;left:-9999px;top:-9999px";
        document.body.appendChild(el);
        el.focus();
        el.select();
        document.execCommand("copy");
        document.body.removeChild(el);
      }
      setter(true);
      setTimeout(() => setter(false), 1800);
      setMessage("✅ Copied to clipboard");
    } catch (e) {
      setError("Copy failed. Select and copy manually if your browser blocks clipboard access.");
    }
  };

  const buildConfirmedListText = () => {
    const comp = current.competition ? `
🏆 ${current.competition}` : "";
    const maybeLine = currentMaybes.length ? `

${currentMaybes.length} maybe playing:
${currentMaybes.map((p,i)=>`${i+1}. ${p}`).join("\n")}` : "";
    if (!currentPlayers.length && !currentMaybes.length) return `${formatDate(currentDate)}${comp}

No players confirmed yet.`;
    const confirmedLine = currentPlayers.length ? `${currentPlayers.length} playing:
${currentPlayers.map((p,i)=>`${i+1}. ${p}`).join("\n")}` : "No confirmed players yet.";
    return `⛳ Golf – ${formatDate(currentDate)}${comp}

${confirmedLine}${maybeLine}

Bookings confirmed ✅`;
  };


  const auditText = (entry) => {
    const time = entry.ts ? new Date(entry.ts).toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"}) : "";
    const actor = entry.actor ? `${entry.actor} ` : "";
    const fromTo = entry.from || entry.to ? ` (${entry.from || "?"} → ${entry.to || "?"})` : "";
    const label = { joined:"set playing", maybe:"set maybe", removed_self:"removed", admin_added:"admin added", admin_removed:"admin removed", admin_locked:"locked list", admin_unlocked:"unlocked list", draw_regenerated:"redrew draw", priority_added:"marked early tee", priority_removed:"removed early tee", competition_changed:"changed competition" }[entry.action] || entry.action;
    return `${time} — ${actor}${label} ${entry.name || ""}${fromTo}`;
  };

  const buildReminderText = () => {
    return `⛳ Weekend Golf Sign-Up is open!\n\nPlease confirm if you're playing:\n📅 ${formatDate(chosenW.sat)}\n📅 ${formatDate(chosenW.sun)}\n\nSign-up closes at 6:50pm on Wednesday (Saturday) and Thursday (Sunday).\n\nTap the link to add your name 👇\n${APP_URL}`;
  };

  return <div className="wrap">
    <div className="header">
      <div style={{fontSize:28}}>⛳</div><h1 className="title">Weekend Golf</h1><p className="sub">WHO'S PLAYING?</p>
      <div className="status">🟢 {status}</div>
      <button className="adminBtn" onClick={()=>adminMode?logoutAdmin():setShowPin(true)} style={{background:adminMode?"#2f5d35":"#fffdf7",color:adminMode?"#ffffff":"#2f5d35",border:`1px solid ${adminMode?"#2f5d35":"#a9bea1"}`}}>{adminMode?"ADMIN ✓":"ADMIN"}</button>
    </div>

    {message && <div className="msg">{message}</div>}
    {error && <div className="msg err">⚠️ {error}</div>}

    {!adminMode && <div className="identityBox">
      <div className="label">YOUR PLAYER LOGIN</div>
      <div style={{fontSize:12,color:"#60715d"}}>Choose your name and enter your PIN. You can only change your own booking.</div>
      <div className="identityRow"><select className="select" value={playerName} onChange={e=>{setPlayerName(e.target.value); setPinLoggedIn(false);}}><option value="">Select your name...</option>{INITIAL_MEMBERS.map(n=><option key={n} value={n}>{n}</option>)}</select><input className="input" type="password" inputMode="numeric" value={playerPin} onChange={e=>{setPlayerPin(e.target.value); setPinLoggedIn(false);}} placeholder="PIN" style={{maxWidth:92}}/></div>
      <div className="identityRow"><button className="smallBtn" onClick={loginPlayer}>Log in</button>{pinLoggedIn && <button className="smallBtn" onClick={logoutPlayer}>Log out</button>}<span style={{fontSize:12,color:pinLoggedIn?"#2f5d35":"#7c8d78"}}>{pinLoggedIn ? `Logged in as ${playerName}` : "Ask admin if you need a PIN."}</span></div>
    </div>}

    <div className="section">
      <div className="label">SELECT WEEKEND</div>
      <select className="select" value={toDateKey(chosenW.sat)} onChange={changeWeekend}>
        {weekends.map((w,i)=>(
          <option key={toDateKey(w.sat)} value={toDateKey(w.sat)}>{optionLabel(w,i)}</option>
        ))}
      </select>
    </div>

    <div className="tabs">
      <button className={`tab ${activeDay==="sat"?"active":""}`} onClick={()=>{setActiveDay("sat");setSelectedKey(toDateKey(chosenW.sat));}}>SATURDAY<br/><small>{chosenW.sat.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</small></button>
      <button className={`tab ${activeDay==="sun"?"active":""}`} onClick={()=>{setActiveDay("sun");setSelectedKey(toDateKey(chosenW.sun));}}>SUNDAY<br/><small>{chosenW.sun.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</small></button>
    </div>

    <div className="section dateBar">
      <div><div className="date">{formatDate(currentDate)}</div>{current.competition && <div className="comp">🏆 {current.competition}</div>}<div className="key">Saving date key: {dateKey}</div>{!current.locked && !signupClosed && <div className="key">Sign-up closes {formatCutoff(currentDate)}</div>}{effectiveLocked && <div style={{color:"#e87840",fontSize:11,marginTop:4}}>🔒 {current.locked ? "List locked by admin" : `Sign-up closed ${formatCutoff(currentDate)} — list visible only`}</div>}</div>
      <div className="count">{currentPlayers.length} confirmed<br/><small>{currentMaybes.length} maybe</small><br/><small>{currentPlayers.length?Math.ceil(currentPlayers.length/4):0} tee time{currentPlayers.length>4?"s":""}</small></div>
    </div>

    {current.locked && current.draw && <div className="draw"><div className="drawHead">🎲 TEE TIME DRAW</div>{current.draw.map((g,i)=><div className="group" key={i}><div className="groupH"><span>TEE {i+1}</span><span>{groupLabel(g.length)}</span></div>{g.map((p,j)=><div className="groupP" key={p}>{j+1}. {currentPriority.includes(p)?"⭐ ":""}{p}</div>)}</div>)}</div>}

    {effectiveLocked && <div className="confirmedBox"><div className="confirmedTitle">CONFIRMED FOR THIS DATE</div><div className="confirmedChips">{currentPlayers.length ? currentPlayers.map((p,i)=><span className="chip" key={p}>{i+1}. {currentPriority.includes(p)?"⭐ ":""}{p}</span>) : <span style={{color:"#4a6a4a",fontSize:13}}>No players confirmed yet.</span>}</div>{currentMaybes.length > 0 && <><div className="confirmedTitle" style={{marginTop:12}}>MAYBE PLAYING</div><div className="confirmedChips">{currentMaybes.map((p,i)=><span className="chip maybeChip" key={p}>{i+1}. {p}</span>)}</div></>}</div>}

    <div className="players"><div className="label">{effectiveLocked?"CONFIRMED PLAYERS, MAYBES, THEN OTHERS":"CHOOSE PLAYING OR MAYBE"}</div>{playerDisplayNames.map(name=>{
      const isIn=currentPlayers.includes(name);
      const isMaybe=currentMaybes.includes(name);
      const disabledForUser = (effectiveLocked && !adminMode) || (!adminMode && !canEditPlayer(name));
      return <div className={`row ${disabledForUser?"lockedOther":""}`} key={name}>
        <button className={`player ${isIn?"in":isMaybe?"maybe":""}`} disabled={disabledForUser} onClick={()=>choosePlaying(name)}><span>{name}</span><span>{isIn?"✓":isMaybe?"Maybe":""}</span></button>
        <button className={`maybeBtn ${isMaybe?"active":""}`} disabled={disabledForUser} onClick={()=>chooseMaybe(name)}>{isMaybe?"Maybe ✓":"Maybe"}</button>
        {adminMode && isIn && <button className={`priorityBtn ${currentPriority.includes(name)?"active":""}`} onClick={()=>togglePriority(name)}>{currentPriority.includes(name)?"⭐ Early":"☆ Early"}</button>}
        {adminMode && (isIn || isMaybe) && <button className="smallBtn danger" onClick={()=>setConfirmRemove({ name, from: isIn ? "playing" : "maybe" })}>✕</button>}
      </div>
    })}</div>

    {adminMode && <div className="adminPanel">
      <div className="adminTitle">ADMIN CONTROLS</div>
      <div style={{padding:"10px",border:"1px solid var(--border)",borderRadius:9,background:"#fffdf7"}}>
        <div className="label">PLAYER PIN MANAGEMENT</div>
        <div className="row"><select className="select" value={pinPlayer} onChange={e=>setPinPlayer(e.target.value)}><option value="">Choose player...</option>{INITIAL_MEMBERS.map(n=><option key={n} value={n}>{n}{pinConfigured[n] ? " ✓" : ""}</option>)}</select><input className="input" type="text" inputMode="numeric" value={pinValue} onChange={e=>setPinValue(e.target.value)} placeholder="New PIN / blank to clear"/></div>
        <button className="btn" onClick={savePlayerPin}>🔑 Save / clear player PIN</button>
      </div>
      <div className="row"><input className="input" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Add player name..."/><button className="smallBtn" onClick={()=>{ const n=newName.trim(); if(n) setConfirmAdd({ name:n, mode:"adminManual" }); }}>Add</button></div>
      {editingComp ? (
        <div className="row">
          <input className="input" value={compInput} onChange={e=>setCompInput(e.target.value)} autoFocus placeholder="Competition name for this day only"/>
          <button className="smallBtn" onClick={async()=>{await adminPost("admin/competition", {competition:compInput}); setEditingComp(false); setCompInput("");}}>Save</button>
          <button className="smallBtn danger" onClick={()=>{setEditingComp(false); setCompInput("");}}>Cancel</button>
        </div>
      ) : <button className="btn" onClick={()=>{setCompInput(current.competition||"");setEditingComp(true);}}>🏆 Edit competition name for {formatDate(currentDate)}</button>}
      <button className="btn" onClick={()=>copyText(buildConfirmedListText(), setCopiedSummary)}>{copiedSummary ? "✓ Copied confirmed list" : "📋 Copy confirmed attendee list for WhatsApp"}</button>
      <button className="btn" onClick={()=>copyText(buildReminderText(), setCopiedReminder)}>{copiedReminder ? "✓ Copied reminder" : "📣 Copy sign-up reminder for WhatsApp"}</button>
      <button className="btn" onClick={()=>adminPost("admin/lock", {locked:!current.locked})}>{current.locked?"🔓 Unlock list":"🔒 Lock list & generate draw"}</button>
      {current.locked && <button className="btn" onClick={()=>adminPost("admin/redraw", {})}>🔀 Re-draw</button>}
      <button className="btn" onClick={()=>setShowAudit(!showAudit)}>📋 Activity log ({(current.audit||[]).length})</button>
      {showAudit && <div className="auditLog">{(current.audit||[]).length ? [...current.audit].reverse().map((e,i)=><div className="auditItem" key={i}>{auditText(e)}</div>) : <div className="auditItem">No activity yet.</div>}</div>}
      <button className="btn" onClick={load}>🔄 Refresh data</button>
    </div>}

    {showPin && <div className="modal"><div className="modalBox"><div style={{fontSize:28}}>🔐</div><h3 style={{color:"#2f5d35",fontWeight:"normal"}}>Admin PIN</h3><input className="input" type="password" inputMode="numeric" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>e.key==="Enter"&&attemptAdmin()} placeholder="Enter PIN"/><div className="modalActions"><button className="ghost" onClick={()=>setShowPin(false)}>Cancel</button><button className="green" onClick={attemptAdmin}>Enter</button></div></div></div>}
    {confirmAdd && <div className="modal"><div className="modalBox"><h3 style={{color:"#223322",fontWeight:"normal"}}>{confirmAdd.mode==="maybeToPlaying"?"Confirm as playing?":"Add to booking?"}</h3><p>Add <strong style={{color:"#2f5d35"}}>{confirmAdd.name}</strong> as <strong>playing</strong> on {formatDate(currentDate)}?</p><p style={{fontSize:12,color:"#60715d",lineHeight:1.4}}>Please confirm this is the correct player, date and status before saving.</p><div className="modalActions"><button className="ghost" onClick={()=>setConfirmAdd(null)}>Cancel</button><button className="green" onClick={async()=>{const item=confirmAdd; setConfirmAdd(null); if(item.mode==="adminManual"){ await adminPost("admin/add-player", {name:item.name}); setNewName(""); } else { await setPlayerStatus(item.name, "playing"); }}}>Yes, add</button></div></div></div>}
    {confirmMaybe && <div className="modal"><div className="modalBox"><h3 style={{color:"#223322",fontWeight:"normal"}}>{confirmMaybe.mode==="playingToMaybe"?"Move to maybe?":"Mark as maybe?"}</h3><p>Mark <strong style={{color:"#7a5a16"}}>{confirmMaybe.name}</strong> as <strong>maybe playing</strong> on {formatDate(currentDate)}?</p><p style={{fontSize:12,color:"#60715d",lineHeight:1.4}}>Please confirm this is the correct player, date and status before saving.</p><div className="modalActions"><button className="ghost" onClick={()=>setConfirmMaybe(null)}>Cancel</button><button className="green" onClick={async()=>{const item=confirmMaybe; setConfirmMaybe(null); await setPlayerStatus(item.name, "maybe");}}>Yes, maybe</button></div></div></div>}
    {confirmRemove && <div className="modal"><div className="modalBox"><h3 style={{color:"#223322",fontWeight:"normal"}}>Remove from list?</h3><p>Remove <strong style={{color:"#2f5d35"}}>{confirmRemove.name}</strong> from {formatDate(currentDate)}?</p><div className="modalActions"><button className="ghost" onClick={()=>setConfirmRemove(null)}>Cancel</button><button className="ghost danger" onClick={async()=>{const item=confirmRemove; setConfirmRemove(null); adminMode ? await adminPost("admin/remove-player", {name:item.name}) : await setPlayerStatus(item.name, "none");}}>Yes, remove</button></div></div></div>}
  </div>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
